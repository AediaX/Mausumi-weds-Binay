<!doctype html><meta charset="utf-8"><body style="margin:0;background:#888">
<script src="../libs/three.min.js"></script><script src="../roses.js"></script>
<script>
/* Bakes transparent rose / leaf / petal images. Run via tools/bake.py (Playwright) - not used by the live site. */
const R = RoseKit, T = THREE;
const renderer = new T.WebGLRenderer({ antialias: true, alpha: true, preserveDrawingBuffer: true });
renderer.setClearColor(0x000000, 0); renderer.shadowMap.enabled = true; renderer.shadowMap.type = T.PCFSoftShadowMap;
renderer.toneMapping = T.NoToneMapping; renderer.outputColorSpace = T.SRGBColorSpace;
document.body.appendChild(renderer.domElement);
function envMap() {
  const s = new T.Scene(), sph = new T.Mesh(new T.SphereGeometry(20, 24, 12), new T.MeshBasicMaterial({ color: 0xf3e0d8, side: T.BackSide })); s.add(sph);
  const panel = (c, i, x, y, z, w, h) => { const m = new T.Mesh(new T.PlaneGeometry(w, h), new T.MeshBasicMaterial({ color: new T.Color(c).multiplyScalar(i), side: T.DoubleSide })); m.position.set(x, y, z); m.lookAt(0, 0, 0); s.add(m); };
  panel(0xfff3e4, 7, -9, 12, 8, 10, 8); panel(0xffd9a8, 4, 12, 4, 6, 6, 10); panel(0xf7a8bd, 2.5, 0, -12, 4, 14, 6); panel(0xffffff, 3, 0, 10, -10, 14, 4);
  const pm = new T.PMREMGenerator(renderer); const t = pm.fromScene(s, 0.03).texture; return t;
}
const env = envMap();
function shoot(mesh, size, cam, fit) {
  const scene = new T.Scene(); scene.environment = env;
  const box = new T.Box3().setFromObject(mesh), sph = box.getBoundingSphere(new T.Sphere());
  scene.add(mesh);
  scene.add(new T.HemisphereLight(0xfff2ea, 0xe58aa2, 0.55));
  const key = new T.DirectionalLight(0xfff6ee, 2.8); key.position.set(-2.2, 3.4, 2.6).multiplyScalar(2); key.castShadow = true;
  key.shadow.mapSize.set(2048, 2048); key.shadow.bias = -0.0004; key.shadow.normalBias = 0.012; key.shadow.radius = 5;
  const sc = key.shadow.camera; sc.left = -2; sc.right = 2; sc.top = 2; sc.bottom = -2; sc.near = 0.1; sc.far = 20; scene.add(key);
  const rim = new T.DirectionalLight(0xffd18a, 1.1); rim.position.set(3, 1.2, -2); scene.add(rim);
  const r = sph.radius * (fit || 1.04) * 0.74, camO = new T.OrthographicCamera(-r, r, r, -r, 0.1, 50);
  camO.position.copy(sph.center).add(new T.Vector3(...cam).normalize().multiplyScalar(10)); camO.lookAt(sph.center); camO.up.set(0, 1, 0);
  renderer.setPixelRatio(1); renderer.setSize(size, size); renderer.render(scene, camO);
  const url = renderer.domElement.toDataURL("image/png"); scene.remove(mesh); return url;
}
function rose(o, mat) { const g = new T.Group(); const m = new T.Mesh(R.roseGeometry(Object.assign({ nu: 22, nv: 30 }, o)), mat); m.castShadow = m.receiveShadow = true; g.add(m);
  if (o.calyx) { const c = new T.Mesh(R.calyxGeometry(o.seed), R.material("leaf")); c.castShadow = true; g.add(c); const st = new T.Mesh(new T.CylinderGeometry(0.05, 0.06, 1.2, 10), new T.MeshStandardMaterial({ color: 0x3f6a45, roughness: .6 })); st.position.y = -0.7; g.add(st); }
  return g; }
window.bake = function (name, size) {
  const roseMat = R.material("rose", { env: 0.55 }), leafMat = R.material("leaf", { env: 0.6 });
  const defs = {
    roseA: () => { const g = rose({ scheme: "pink", seed: 21, open: 1 }, roseMat); g.rotation.set(0.5, 0.4, 0); return shoot(g, size, [0, 1, 0.55], 1.0); },
    roseB: () => { const g = rose({ scheme: "blush", seed: 5, open: 0.9 }, roseMat); g.rotation.set(0.75, 1.9, 0.1); return shoot(g, size, [0, 1, 0.5], 1.0); },
    roseC: () => { const g = rose({ scheme: "ivory", seed: 33, open: 0.95 }, roseMat); g.rotation.set(0.55, 3.4, -0.1); return shoot(g, size, [0, 1, 0.35], 1.0); },
    roseD: () => { const g = rose({ scheme: "deep", seed: 12, open: 0.8 }, roseMat); g.rotation.set(0.9, 5.0, 0.2); return shoot(g, size, [0, 1, 0.55], 1.0); },
    budA: () => { const g = rose({ scheme: "pink", seed: 8, open: 0.1, layers: 4, calyx: true }, roseMat); g.rotation.set(0.15, 0.6, 0.45); return shoot(g, size, [0, 0.35, 1], 1.0); },
    budB: () => { const g = rose({ scheme: "blush", seed: 14, open: 0.35, layers: 5, calyx: true }, roseMat); g.rotation.set(0.1, 2.2, -0.5); return shoot(g, size, [0, 0.4, 1], 1.0); },
    leafA: () => { const m = new T.Mesh(R.leafGeometry(5), leafMat); m.castShadow = true; m.rotation.set(-0.35, 0.2, 0); return shoot(m, size, [0.2, 0.5, 1], 1.0); },
    leafB: () => { const m = new T.Mesh(R.leafGeometry(9), leafMat); m.castShadow = true; m.rotation.set(-0.15, -0.25, 0.1); return shoot(m, size, [-0.2, 0.7, 1], 1.0); },
    petalA: () => { const m = new T.Mesh(R.loosePetalGeometry("pink", 3), roseMat); m.castShadow = true; m.rotation.set(-0.25, 0.3, 0.2); return shoot(m, size, [0, 1, 0.5], 1.0); },
    petalB: () => { const m = new T.Mesh(R.loosePetalGeometry("blush", 4), roseMat); m.castShadow = true; m.rotation.set(-0.5, -0.4, -0.3); return shoot(m, size, [0.2, 1, 0.6], 1.0); },
    petalC: () => { const m = new T.Mesh(R.loosePetalGeometry("ivory", 6), roseMat); m.castShadow = true; m.rotation.set(-0.35, 0.6, 0.7); return shoot(m, size, [0, 1, 0.4], 1.0); },
  };
  return defs[name]();
};
</script>
