<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Mausumi Weds Binay | Wedding Invitation</title>
<meta name="description" content="You are cordially invited to the wedding of Mausumi and Binay. 12 and 13 December 2026, Belpal, Mayurbhanj, Odisha.">
<meta name="theme-color" content="#FAF6F0">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<!-- Open Graph (link previews). Put a 1200x630 picture named og-image.jpg next to index.html and uncomment the image line. -->
<meta property="og:type" content="website">
<meta property="og:title" content="Mausumi Weds Binay">
<meta property="og:description" content="With divine blessings, you are cordially invited to the sacred union. 12 and 13 December 2026, Belpal, Mayurbhanj, Odisha.">
<meta property="og:image" content="img/ganesha.png">
<meta name="twitter:card" content="summary_large_image">

<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<link rel="preload" as="image" href="img/ganesha.webp">
<link rel="preload" as="image" href="img/bouquet.webp">
<link rel="stylesheet" href="style.css">
</head>
<body>
<a class="skip-link" href="#book">Skip to the invitation</a>

<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <linearGradient id="gFoil" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="0"><stop offset="0" stop-color="#A57C2A"/><stop offset=".25" stop-color="#E9D08A"/><stop offset=".5" stop-color="#C9A24B"/><stop offset=".75" stop-color="#F3E3A8"/><stop offset="1" stop-color="#A57C2A"/></linearGradient>
  <linearGradient id="gFoilV" gradientUnits="userSpaceOnUse" x1="0" y1="0" x2="300" y2="420"><stop offset="0" stop-color="#B08A32"/><stop offset=".3" stop-color="#EBD38F"/><stop offset=".55" stop-color="#C9A24B"/><stop offset=".8" stop-color="#F1DFA0"/><stop offset="1" stop-color="#A57C2A"/></linearGradient>
</defs></svg>

<div id="gate" class="gate" role="dialog" aria-label="Wedding invitation of Mausumi and Binay">
  <div class="gate-paper" aria-hidden="true"></div>
  <div class="gate-toran" aria-hidden="true"></div>
  <canvas id="gateFx" class="gate-fx" aria-hidden="true"></canvas>

  <div class="gate-arch" aria-hidden="true">
    <svg class="gate-finial" viewBox="0 0 60 80"><g fill="none" stroke="url(#gFoil)" stroke-width="1.3" stroke-linecap="round" stroke-linejoin="round"><path d="M30 6 C24 14 24 20 30 24 C36 20 36 14 30 6Z" fill="#E9D08A" fill-opacity=".55"/><path d="M30 24 C20 24 14 28 12 34 M30 24 C40 24 46 28 48 34"/><path d="M18 36 H42 C42 50 38 60 30 66 C22 60 18 50 18 36Z" fill="#F4B6C2" fill-opacity=".35"/><path d="M22 70 H38 M26 66 V70 M34 66 V70"/><circle cx="30" cy="3" r="1.6" fill="#C9A24B"/></g></svg>
  </div>

  <img class="gate-bq b-tl" data-d="1" src="img/bouquet.webp" alt="" aria-hidden="true" decoding="async" draggable="false">
  <img class="gate-bq b-tr" data-d="1" src="img/bouquet.webp" alt="" aria-hidden="true" decoding="async" draggable="false">
  <img class="gate-bq b-bl" data-d="2" src="img/bouquet.webp" alt="" aria-hidden="true" decoding="async" draggable="false">
  <img class="gate-bq b-br" data-d="2" src="img/bouquet.webp" alt="" aria-hidden="true" decoding="async" draggable="false">

  <div class="gate-in">
    <div class="gate-halo">
      <span class="halo-rays" aria-hidden="true"></span><span class="halo-ring" aria-hidden="true"></span>
      <div class="gate-gan">
        <img src="img/ganesha.webp" alt="Lord Ganesha" decoding="async" fetchpriority="high">
        <span class="gan-shine" aria-hidden="true"></span>
      </div>
    </div>
    <p class="gate-shloka" lang="hi">॥ श्री गणेशाय नमः ॥</p>
    <p class="gate-bless">With the divine blessings of Lord Ganesha</p>
    <svg class="gate-orn" viewBox="0 0 300 24" aria-hidden="true"><g fill="none" stroke="url(#gFoil)" stroke-width="1.1" stroke-linecap="round"><path d="M10 12 H112 M188 12 H290"/><path d="M150 2 C142 8 142 16 150 22 C158 16 158 8 150 2Z" fill="#F4B6C2" fill-opacity=".5"/><path d="M150 22 C136 21 126 16 124 8 M150 22 C164 21 174 16 176 8"/><circle cx="118" cy="12" r="2"/><circle cx="182" cy="12" r="2"/></g></svg>
    <p class="gate-lead">Shubh Vivah</p>
    <h1 class="gate-names"><span class="foil-text">Mausumi</span><em>&amp;</em><span class="foil-text">Binay</span></h1>
    <p class="gate-sub">12 &amp; 13 December 2026</p>
    <p id="gateGuest" class="gate-guest" hidden></p>
    <button type="button" id="gateBtn" class="gate-seal is-loading" aria-label="Open the wedding invitation" disabled>
      <span class="seal-ripple" aria-hidden="true"></span>
      <span class="seal-disc" aria-hidden="true"><b>M</b><i>&#10084;</i><b>B</b></span>
    </button>
  </div>
</div>

<main id="stage" class="stage" data-state="loading">

  <!-- 2D fallback envelope (only shown when WebGL is missing) -->
  <div id="env2d" class="env2d" hidden>
    <svg viewBox="0 0 360 320" role="img" aria-label="Closed wedding envelope with a gold wax seal">
      <defs>
        <linearGradient id="e2dBody" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FAF6F0"/><stop offset="1" stop-color="#F7CAD0"/></linearGradient>
        <linearGradient id="e2dFlap" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F4B6C2"/><stop offset="1" stop-color="#F7CAD0"/></linearGradient>
      </defs>
      <rect x="2" y="2" width="356" height="316" rx="4" fill="url(#e2dBody)" stroke="#C9A24B" stroke-width="1.5"/>
      <path d="M2 318 L180 172 L358 318 M2 2 L180 172 L358 2" fill="none" stroke="#C9A24B" stroke-width=".8" opacity=".6"/>
      <path d="M2 2 H358 L180 186 Z" fill="url(#e2dFlap)" stroke="#C9A24B" stroke-width="1.5"/>
      <g id="sealCircle">
        <circle cx="180" cy="168" r="36" fill="#A82E4E"/>
        <circle cx="180" cy="168" r="30" fill="none" stroke="#E8CB7A" stroke-width="1.5"/>
        <path d="M180 184 C163 172 165 158 175 157 C178 156.500 180 159 180 161 C180 159 182 156.500 185 157 C195 158 197 172 180 184Z" fill="#E8CB7A"/>
      </g>
    </svg>
  </div>

  <!-- 3D scene -->
  <canvas id="gl" aria-hidden="true"></canvas>

  <!-- Scene 2: scratch-off gold foil (placed over the envelope by JavaScript) -->
  <div id="foil" class="foil" hidden>
    <canvas id="scratch" tabindex="0" role="button"
      aria-label="Scratch the gold foil to open the invitation. Press Enter or Space to open it instantly."></canvas>
  </div>

  <div id="hud" class="hud" hidden>
    <div class="ring" role="progressbar" aria-label="Scratch progress" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <svg viewBox="0 0 64 64" aria-hidden="true">
        <circle class="ring-bg" cx="32" cy="32" r="26"/>
        <circle id="ringFg" class="ring-fg" cx="32" cy="32" r="26"/>
      </svg>
      <span id="pct">0%</span>
    </div>
  </div>

  <div id="flash" class="flash" aria-hidden="true"></div>

  <!-- Scene 4: the card. Pages are written into #book by app.js -->
  <section id="bookWrap" class="book-wrap" aria-label="Wedding invitation card">
    <div id="book" class="book" tabindex="0" aria-roledescription="card"></div>
    <nav id="pager" class="pager" aria-label="Pages">
      <button type="button" id="prevBtn" class="pg-arrow" aria-label="Previous page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M15 5 L8 12 L15 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <div id="dots" class="dots"></div>
      <button type="button" id="nextBtn" class="pg-arrow" aria-label="Next page">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 5 L16 12 L9 19" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </nav>
  </section>

  <div class="toolbar">
    <button type="button" id="skipBtn" class="chip">Skip intro</button>
    <button type="button" id="fsBtn" class="chip chip-icon" aria-label="Toggle full screen">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9V4h5M20 9V4h-5M4 15v5h5M20 15v5h-5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <button type="button" id="soundBtn" class="chip chip-icon" aria-pressed="true" aria-label="Mute sound">
      <svg viewBox="0 0 24 24" aria-hidden="true">
        <path d="M4 9.500 H8 L13 5.500 V18.500 L8 14.500 H4 Z" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/>
        <path class="waves" d="M16 9 C17.500 10.500 17.500 13.500 16 15 M18.500 6.500 C21.500 9.500 21.500 14.500 18.500 17.500" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
        <path class="mute" d="M17 9.500 L22 14.500 M22 9.500 L17 14.500" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/>
      </svg>
    </button>
  </div>

  <p id="live" class="sr-only" aria-live="polite"></p>
</main>

<noscript>
  <div class="noscript">
    <h1>Mausumi Weds Binay</h1>
    <p>With the divine blessings of Lord Ganesha, you are cordially invited to the sacred union of Mausumi and Binay. Saturday 12 December 2026, 5:30 PM, Mehendi &amp; Sangeet. Sunday 13 December 2026, Mangalakruta, Marriage &amp; Panigrahan, then Reception &amp; Dinner from 7:00 PM. At Our Residence, Belpal, Badshahi, Mayurbhanj, Odisha, India.</p>
    <p>RSVP: Mrs. Puspalata Bhuyan &amp; Mr. Sanat Kumar Bhuyan, 6371122623, 7854998757.</p>
    <p>Please turn on JavaScript to open the interactive invitation.</p>
  </div>
</noscript>

<script src="roses.js"></script>

</body>
</html>
